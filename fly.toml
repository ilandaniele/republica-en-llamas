app = "republica-en-llamas"
primary_region = "gru"

# VITE_* build args are passed by CI (flyctl deploy --build-arg); see .github/workflows/deploy.yml.
[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
