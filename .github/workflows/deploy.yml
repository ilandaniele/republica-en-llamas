name: CI and deploy

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: |
          npm run type-check --workspace=packages/game-engine
          npm run type-check --workspace=apps/web
          npm run type-check --workspace=apps/api
          npm run type-check --workspace=apps/mobile

      - name: Test
        run: |
          npm test --workspace=packages/game-engine
          npm test --workspace=apps/web

      - name: Verify game content
        run: npm run verify:content

      - name: Security regression tests
        run: npm run test:security

      - name: Build production game
        run: npm run build --workspace=apps/web

  deploy:
    name: Deploy
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-production
    env:
      HUSKY: 0
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Build web
        run: npm run build --workspace=apps/web
        env:
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}

      - name: Apply D1 migrations
        run: npm run db:migrate

      - name: Deploy Worker
        run: npm run deploy --workspace=apps/api
