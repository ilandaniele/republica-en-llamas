name: CI and deploy

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Audit shipped dependencies
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high --workspace=apps/web --workspace=apps/api --workspace=packages/game-engine

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: |
          npm run type-check --workspace=packages/game-engine
          npm run type-check --workspace=apps/web
          npm run type-check --workspace=apps/api
          npm run type-check --workspace=apps/mobile

      - name: Test
        run: |
          npm test --workspace=packages/game-engine
          npm test --workspace=apps/web

      - name: Verify game content
        run: npm run verify:content

      - name: Security regression tests
        run: npm run test:security

      - name: Build production game
        run: npm run build --workspace=apps/web

  latest:
    name: Check latest main
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      is-latest: ${{ steps.head.outputs.is-latest }}
    steps:
      - id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          echo "is-latest=$([ "$head" = "$GITHUB_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy
    needs: latest
    if: needs.latest.outputs.is-latest == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency: deploy-production
    env:
      HUSKY: 0
      PUBLIC_URL: https://republica-en-llamas.ilandaniele.workers.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Build web
        run: npm run build --workspace=apps/web
        env:
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_GOOGLE_SIGN_IN: 'true'

      - name: Record D1 Time Travel bookmark
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          {
            echo '## Pre-migration D1 bookmark'
            echo '```'
            npx wrangler d1 time-travel info republica-en-llamas
            echo '```'
            echo 'Roll back the Worker: `npx wrangler rollback` (from apps/api).'
            echo 'Restore D1: `npx wrangler d1 time-travel restore republica-en-llamas --bookmark=<bookmark above>`.'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Apply D1 migrations
        run: npm run db:migrate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npm run deploy --workspace=apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 "$PUBLIC_URL/" -o /dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 "$PUBLIC_URL/api/health"
